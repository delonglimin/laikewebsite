# ============================================================
# 主题与构建配置（Hugo 会与 config/_default/ 合并）
#   站点信息 / SEO / 语言 / 分类法 统一放在 config/_default/hugo.yaml
#   本文件只保留主题挂载与 Tailwind 构建相关配置
# ============================================================

theme: "hugo-agency-web"

build:
  buildStats:
    enable: true

  cachebusters:
    - source: "assets/notwatching/hugo_stats\\.json"
      target: "css"

    - source: "(postcss|tailwind)\\.config\\.js"
      target: "css"

module:
  hugo_version:
    min: "0.147.8"

  mounts:
    - source: "hugo_stats.json"
      target: "assets/notwatching/hugo_stats.json"
      disableWatch: true

    - source: "assets"
      target: "assets"
