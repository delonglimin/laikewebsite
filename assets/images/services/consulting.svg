<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-label="企业咨询：数字化规划、诊断与实施路线">
  <defs>
    <linearGradient id="csBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6FD"/>
    </linearGradient>
    <linearGradient id="csCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66F2"/>
      <stop offset="1" stop-color="#0145BC"/>
    </linearGradient>
    <radialGradient id="csGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 470) scale(370)">
      <stop offset="0" stop-color="#DCE8FB" stop-opacity=".85"/>
      <stop offset="1" stop-color="#DCE8FB" stop-opacity="0"/>
    </radialGradient>
    <filter id="csSh" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B2A5B" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#csBg)"/>
  <circle cx="600" cy="470" r="370" fill="url(#csGlow)"/>

  <!-- 实施路线 -->
  <path d="M333 571 L511 481 L689 391 L867 264" stroke="#0152D9" stroke-width="3" stroke-dasharray="9 9" stroke-linecap="round" opacity=".4" fill="none"/>

  <!-- 阶段柱 -->
  <rect x="251" y="580" width="164" height="80" rx="20" fill="#EDF3FC"/>
  <rect x="429" y="490" width="164" height="170" rx="20" fill="#DCE8FA"/>
  <rect x="607" y="400" width="164" height="260" rx="20" fill="#C7DAF6"/>
  <g filter="url(#csSh)">
    <rect x="785" y="290" width="164" height="370" rx="20" fill="url(#csCore)"/>
  </g>

  <!-- 阶段节点 -->
  <g fill="#FFFFFF" stroke="#C7DAF6" stroke-width="3">
    <circle cx="333" cy="571" r="10"/>
    <circle cx="511" cy="481" r="10"/>
    <circle cx="689" cy="391" r="10"/>
  </g>

  <!-- 目标 -->
  <circle cx="867" cy="264" r="28" fill="#FFFFFF"/>
  <circle cx="867" cy="264" r="28" stroke="#0152D9" stroke-width="6" fill="none"/>
  <circle cx="867" cy="264" r="9" fill="#0152D9"/>
</svg>
