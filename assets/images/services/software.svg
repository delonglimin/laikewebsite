<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-label="软件开发：Web、移动端与数据大屏定制开发">
  <defs>
    <linearGradient id="swBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6FD"/>
    </linearGradient>
    <linearGradient id="swCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66F2"/>
      <stop offset="1" stop-color="#0145BC"/>
    </linearGradient>
    <radialGradient id="swGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(560 430) scale(400)">
      <stop offset="0" stop-color="#DCE8FB" stop-opacity=".8"/>
      <stop offset="1" stop-color="#DCE8FB" stop-opacity="0"/>
    </radialGradient>
    <filter id="swSh" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#0B2A5B" flood-opacity=".16"/>
    </filter>
    <filter id="swShSm" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B2A5B" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#swBg)"/>
  <circle cx="560" cy="430" r="400" fill="url(#swGlow)"/>

  <!-- 编辑器窗口 -->
  <g filter="url(#swSh)">
    <rect x="230" y="196" width="740" height="470" rx="30" fill="#FFFFFF" stroke="#E3EAF6" stroke-width="2"/>
  </g>
  <line x1="230" y1="262" x2="970" y2="262" stroke="#F0F4FA" stroke-width="2"/>
  <g>
    <circle cx="272" cy="229" r="7" fill="#E1E9F7"/>
    <circle cx="304" cy="229" r="7" fill="#CFDCF0"/>
    <circle cx="336" cy="229" r="7" fill="#0152D9"/>
  </g>
  <line x1="296" y1="262" x2="296" y2="666" stroke="#F0F4FA" stroke-width="2"/>

  <!-- 行号 -->
  <g fill="#E4ECF8">
    <rect x="252" y="296" width="24" height="8" rx="4"/>
    <rect x="252" y="338" width="24" height="8" rx="4"/>
    <rect x="252" y="380" width="24" height="8" rx="4"/>
    <rect x="252" y="422" width="24" height="8" rx="4"/>
    <rect x="252" y="464" width="24" height="8" rx="4"/>
    <rect x="252" y="506" width="24" height="8" rx="4"/>
    <rect x="252" y="548" width="24" height="8" rx="4"/>
    <rect x="252" y="590" width="24" height="8" rx="4"/>
  </g>

  <!-- 代码 -->
  <g>
    <rect x="326" y="294" width="196" height="14" rx="7" fill="#0152D9"/>
    <rect x="358" y="336" width="136" height="14" rx="7" fill="#A8C2EE"/>
    <rect x="358" y="378" width="252" height="14" rx="7" fill="#DCE6F6"/>
    <rect x="358" y="420" width="108" height="14" rx="7" fill="#08D3BB"/>
    <rect x="326" y="462" width="92" height="14" rx="7" fill="#A8C2EE"/>
    <rect x="358" y="504" width="220" height="14" rx="7" fill="#DCE6F6"/>
    <rect x="326" y="546" width="164" height="14" rx="7" fill="#DCE6F6"/>
    <rect x="358" y="588" width="96" height="14" rx="7" fill="#0152D9"/>
  </g>

  <!-- 悬浮代码徽标 -->
  <g filter="url(#swShSm)">
    <rect x="880" y="560" width="140" height="140" rx="38" fill="url(#swCore)"/>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="916,606 894,630 916,654" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="938" y1="662" x2="962" y2="598" stroke="#08D3BB" stroke-width="8"/>
    <polyline points="984,606 1006,630 984,654" stroke="#FFFFFF" stroke-width="8"/>
  </g>
</svg>
