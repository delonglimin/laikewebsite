<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-label="AI 应用开发：智能体编排、工作流与知识库">
  <defs>
    <linearGradient id="aiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F6FD"/>
    </linearGradient>
    <linearGradient id="aiCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A66F2"/>
      <stop offset="1" stop-color="#0145BC"/>
    </linearGradient>
    <radialGradient id="aiGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 400) scale(340)">
      <stop offset="0" stop-color="#DCE8FB" stop-opacity=".9"/>
      <stop offset="1" stop-color="#DCE8FB" stop-opacity="0"/>
    </radialGradient>
    <filter id="aiSh" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B2A5B" flood-opacity=".2"/>
    </filter>
    <filter id="aiShSm" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2A5B" flood-opacity=".1"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#aiBg)"/>
  <circle cx="600" cy="400" r="340" fill="url(#aiGlow)"/>

  <!-- 工作流编排主轴 -->
  <line x1="180" y1="310" x2="1010" y2="310" stroke="#D6E1F2" stroke-width="2" stroke-linecap="round"/>
  <polygon points="1016,310 994,299 994,321" fill="#D6E1F2"/>

  <!-- 流程节点 -->
  <g fill="#FFFFFF" stroke="#C8D6EC" stroke-width="3">
    <circle cx="272" cy="310" r="13"/>
    <circle cx="440" cy="310" r="13"/>
    <circle cx="760" cy="310" r="13"/>
  </g>
  <circle cx="928" cy="310" r="14" fill="#08D3BB"/>

  <!-- 中枢：模型与智能体 -->
  <rect x="534" y="244" width="132" height="132" rx="40" fill="url(#aiCore)" filter="url(#aiSh)"/>
  <circle cx="600" cy="310" r="15" fill="#FFFFFF"/>
  <ellipse cx="600" cy="310" rx="40" ry="17" transform="rotate(-32 600 310)" stroke="#FFFFFF" stroke-width="4" opacity=".95"/>
  <ellipse cx="600" cy="310" rx="40" ry="17" transform="rotate(32 600 310)" stroke="#FFFFFF" stroke-width="4" opacity=".55"/>

  <!-- 知识库 -->
  <rect x="420" y="612" width="360" height="76" rx="22" fill="#EAF1FB"/>
  <rect x="420" y="588" width="360" height="76" rx="22" fill="#FFFFFF" stroke="#E7EEF9" stroke-width="2"/>
  <g filter="url(#aiShSm)">
    <rect x="420" y="564" width="360" height="76" rx="22" fill="#FFFFFF" stroke="#DBE5F5" stroke-width="2"/>
  </g>
  <rect x="458" y="589" width="26" height="26" rx="9" fill="#0152D9"/>
  <rect x="500" y="590" width="130" height="13" rx="6.5" fill="#D9E3F5"/>
  <rect x="500" y="611" width="84" height="13" rx="6.5" fill="#E8EEF9"/>

  <!-- 中枢 → 知识库 -->
  <line x1="600" y1="376" x2="600" y2="564" stroke="#D6E1F2" stroke-width="2" stroke-dasharray="6 8"/>
  <circle cx="600" cy="470" r="5" fill="#C8D6EC"/>
</svg>
